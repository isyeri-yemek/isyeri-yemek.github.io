<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1220">
<title>Bugünün Menüsü</title>
<script>
(function(){var t="dark";try{var s=localStorage.getItem("theme");if(s==="light"||s==="dark")t=s}catch(e){}document.documentElement.dataset.theme=t})();
</script>
<style>
  :root{
    color-scheme:dark;
    --bg:#0a1220;--ink:#f4f8ff;--muted:#b4c3d8;
    --glass:rgba(255,255,255,.09);--glass-strong:rgba(255,255,255,.14);--glass-line:rgba(255,255,255,.20);
    --accent:#5aa0e6;--accent2:#7cc4ff;--accent-ink:#06121f;
    --tag:#d6e8ff;--tag-bg:rgba(90,160,230,.22);
    --b1:#2f7bff;--b2:#12c2e9;--b3:#6a4cff;
    --brand:#ff8a1f
  }
  /* Öğün başına renk */
  body[data-meal="ÖĞLE"]{--accent:#ffb938;--accent2:#ff8a1f;--accent-ink:#2b1500;--tag:#ffe3ad;--tag-bg:rgba(255,170,40,.22);--b1:#e0720a;--b2:#d99a12;--b3:#c2410c;--brand:#ff8a1f}
  body[data-meal="AKŞAM"]{--accent:#5aa8f0;--accent2:#7cd0ff;--accent-ink:#04121f;--tag:#d6ecff;--tag-bg:rgba(90,168,240,.24);--b1:#2f7bff;--b2:#12c2e9;--b3:#5b5bff;--brand:#5aa8f0}
  body[data-meal="GECE"]{--accent:#a89bff;--accent2:#d28bff;--accent-ink:#0f0a30;--tag:#e6e0ff;--tag-bg:rgba(168,155,255,.24);--b1:#7a4dff;--b2:#d946ef;--b3:#3b82f6;--brand:#a89bff}
  /* Açık tema */
  html[data-theme="light"]{color-scheme:light;--bg:#e8f0fb;--ink:#0f2038;--muted:#455b75;--glass-line:rgba(255,255,255,.8)}
  html[data-theme="light"] .glass{background:linear-gradient(135deg,rgba(255,255,255,.80),rgba(255,255,255,.50));box-shadow:0 8px 28px rgba(31,70,120,.16),inset 0 1px 0 rgba(255,255,255,.95)}
  html[data-theme="light"] .blobs i{opacity:.5}
  html[data-theme="light"] h1{text-shadow:none}
  html[data-theme="light"] .sec{color:#1e3552;text-shadow:none}
  html[data-theme="light"] .brand{background:#12233a;border-color:#12233a}
  html[data-theme="light"] .sec svg{stroke:var(--tag)}
  html[data-theme="light"] .salad-sec svg{stroke:#15803d}
  html[data-theme="light"] .tag{border-color:rgba(15,32,56,.14)}
  html[data-theme="light"] .tabs button:focus-visible,html[data-theme="light"] .theme-btn:focus-visible{outline-color:#0f2038}
  html[data-theme="light"] .warn{background:rgba(255,190,60,.35);border-color:rgba(160,100,0,.4);color:#6b3f00}
  html[data-theme="light"] body[data-meal="ÖĞLE"]{--tag:#7a4100;--tag-bg:rgba(255,170,40,.30)}
  html[data-theme="light"] body[data-meal="AKŞAM"]{--tag:#0b4a8a;--tag-bg:rgba(60,140,230,.22)}
  html[data-theme="light"] body[data-meal="GECE"]{--tag:#4330a8;--tag-bg:rgba(140,120,255,.24)}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:transparent;position:relative;overflow-x:hidden}
  /* Bulanık renk lekeleri */
  .blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
  .blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;will-change:transform;transition:background .6s}
  .blobs i:nth-child(1){width:70vmax;height:70vmax;max-width:520px;max-height:520px;left:-18%;top:-12%;background:var(--b1);animation:d1 22s ease-in-out infinite alternate}
  .blobs i:nth-child(2){width:60vmax;height:60vmax;max-width:460px;max-height:460px;right:-20%;top:28%;background:var(--b2);opacity:.6;animation:d2 26s ease-in-out infinite alternate}
  .blobs i:nth-child(3){width:64vmax;height:64vmax;max-width:480px;max-height:480px;left:5%;bottom:-18%;background:var(--b3);opacity:.65;animation:d3 30s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(18vw,14vh) scale(1.15)}}
  @keyframes d2{to{transform:translate(-16vw,-12vh) scale(1.1)}}
  @keyframes d3{to{transform:translate(14vw,-16vh) scale(1.2)}}
  main{max-width:520px;margin:0 auto;padding:22px 16px 40px;position:relative}
  /* Cam yüzey */
  .glass{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(9,16,30,.46);border:1px solid var(--glass-line);box-shadow:0 8px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(24,38,60,.92)}}
  header{border-radius:26px;padding:20px 20px 18px;margin-bottom:14px;position:relative}
  .theme-btn{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(255,255,255,.14);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .25s,transform .2s}
  .theme-btn:hover{background:rgba(255,255,255,.26)}
  .theme-btn:active{transform:scale(.92)}
  .theme-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .theme-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  header .brand,header h1,header .date{padding-right:0}
  header h1{padding-right:52px}
  .brand{display:inline-block;margin-bottom:10px;padding:5px 12px;border-radius:999px;background:rgba(8,16,30,.55);border:1px solid var(--glass-line);font-size:.76rem;font-weight:800;letter-spacing:.12em;color:#fff}
  .brand span{color:var(--brand)}
  h1{margin:0;font-size:1.65rem;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .date{margin-top:2px;font-size:.98rem;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin:0 0 14px;padding:6px;border-radius:20px}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:0;background:transparent;color:var(--muted);border-radius:15px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
  .tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .tabs button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .sec{display:flex;align-items:center;gap:8px;margin:18px 6px 8px;color:#e3ecf9;font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .sec svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .salad-sec svg{stroke:#5ee38f}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  li{border-radius:18px;padding:14px 16px;font-size:1.08rem;font-weight:600;position:relative;overflow:hidden}
  li::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--accent),var(--accent2))}
  ul.salad li::before{background:linear-gradient(180deg,#5ee38f,#2dd4bf)}
  .tag{display:inline-block;margin:6px 6px 0 0;padding:2px 10px;border-radius:999px;background:var(--tag-bg);border:1px solid rgba(255,255,255,.14);color:var(--tag);font-size:.72rem;font-weight:700}
  .note{color:var(--muted);font-size:.85rem;margin-top:22px;text-align:center}
  .warn{background:rgba(255,200,80,.18);border:1px solid rgba(255,200,80,.4);color:#ffe9b8;padding:10px 12px;border-radius:14px;margin-bottom:14px;font-size:.9rem}
  @media (prefers-reduced-motion:reduce){.blobs i{animation:none}*{transition:none!important}}
</style>
</head>
<body data-meal="ÖĞLE">
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header class="glass">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Temayı değiştir"></button>
    <div class="brand"><b>YAZAKI WIRING</b> <span>MUDANYA</span></div>
    <h1>Bugünün Menüsü</h1>
    <div class="date" id="date">Yükleniyor…</div>
  </header>
  <div class="tabs glass" role="tablist" id="tabs"></div>
  <div id="warn"></div>
  <div id="list"></div>
  <div class="note" id="note"></div>
</main>
<script>
const ORDER=[["ÖĞLE","Öğle"],["AKŞAM","Akşam"],["GECE","Gece"]];
const ICON={
 "ÖĞLE":'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 "AKŞAM":'<svg viewBox="0 0 24 24"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 6v3M4.6 10.6l1.8 1.2M19.4 10.6l-1.8 1.2"/></svg>',
 "GECE":'<svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>'};
const ICON_FOOD='<svg viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8M8 3v18M18 3c-2 2-3 5-3 8h3v10"/></svg>';
const ICON_SALAD='<svg viewBox="0 0 24 24"><path d="M4 12h16a8 8 0 0 1-16 0zM8 12c0-3 2-5 4-5s4 2 4 5M12 7V4"/></svg>';
const $=id=>document.getElementById(id);
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
function setTheme(t,save){
  document.documentElement.dataset.theme=t;
  $("themeBtn").innerHTML=t==="dark"?SUN:MOON;
  $("themeBtn").setAttribute("aria-label",t==="dark"?"Açık temaya geç":"Koyu temaya geç");
  document.querySelector('meta[name="theme-color"]').setAttribute("content",t==="dark"?"#0a1220":"#e8f0fb");
  if(save){try{localStorage.setItem("theme",t)}catch(e){}}
}
setTheme(document.documentElement.dataset.theme==="light"?"light":"dark",false);
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);
const title=s=>s.replace(/\s*\(\s*kah\.?\s*\)\s*/gi," ").trim().toLocaleLowerCase("tr").replace(/(^|[\s(\/.-])(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase("tr"));
const DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"],MON=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const row=x=>`<li class="glass">${esc(title(x.name))}${x.allergens.length?"<br>"+x.allergens.map(a=>`<span class="tag">${esc(a)}</span>`).join(""):""}</li>`;
const saladRow=x=>`<li class="glass">${esc(title(x.name))}</li>`;
fetch("menu.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  const [dd,mm,yy]=d.date.split(".").map(Number);const dt=new Date(yy,mm-1,dd);
  $("date").textContent=`${dd} ${MON[mm-1]} ${yy}, ${DAYS[dt.getDay()]}`;
  if(dt.toDateString()!==new Date().toDateString())$("warn").innerHTML='<div class="warn">Bu menü bugüne ait olmayabilir, güncelleme bekleniyor.</div>';
  const avail=ORDER.map(o=>o[0]).filter(k=>d.meals[k]&&d.meals[k].length);
  let cur=avail.includes("ÖĞLE")?"ÖĞLE":avail[0];
  function render(){
    document.body.dataset.meal=cur;
    $("tabs").innerHTML="";
    ORDER.filter(o=>avail.includes(o[0])).forEach(([k,label])=>{
      const b=document.createElement("button");b.setAttribute("role","tab");b.setAttribute("aria-selected",k===cur);
      b.innerHTML=ICON[k]+"<span>"+label+"</span>";
      b.onclick=()=>{cur=k;render()};$("tabs").appendChild(b)});
    const items=d.meals[cur];
    const main=items.filter(x=>x.section!=="SALATBAR"),salad=items.filter(x=>x.section==="SALATBAR");
    $("list").innerHTML=(main.length?`<div class="sec">${ICON_FOOD}Yemek</div><ul>${main.map(row).join("")}</ul>`:"")
      +(salad.length?`<div class="sec salad-sec">${ICON_SALAD}Salatabar</div><ul class="salad">${salad.map(saladRow).join("")}</ul>`:"");
  }
  render();
  $("note").textContent="Generated by Eray";
}).catch(()=>{$("date").textContent="Menü şu an yüklenemedi, biraz sonra tekrar deneyin."});
</script>
</body>
</html>
