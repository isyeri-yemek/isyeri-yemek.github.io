name: Menüyü güncelle

on:
  schedule:
    - cron: '0 3 * * *'     # 03:00 UTC = her gün 06:00 (Türkiye saati)
    - cron: '0 4 * * *'     # 04:00 UTC = her gün 07:00 (06:00 başarısız olursa yedek deneme)
  workflow_dispatch:         # elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Menüyü çek
        env:
          MENU_URL: ${{ secrets.MENU_URL }}
          TZ: Europe/Istanbul
        run: node fetch-menu.js
      - name: Değiştiyse kaydet
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json
          git diff --cached --quiet || (git commit -m "Menü güncellendi" && git push)
